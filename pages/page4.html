<!DOCTYPE html>
<html>
    <head>
        <title>SENİ ÇOK SEVİYORUM</title>

        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/buttons.css">
        <link rel="stylesheet" href="../music-player/music-player.css">
        <link rel="stylesheet" href="../heart-rose-star/heart-rose-star.css">
        
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="hearts-container"></div>
        <div class="roses-container"></div>
        <div class="stars-container"></div>

        <img src="../gifs/cheeks.gif">

        <h2 class="page4-text"> </h2>

        <a href="thanks.html">
            <button>→</button>
        </a>

        <div id="music-player">
            <button id="play-pause-btn">❚❚</button>
            <p id="music-info">00:00 / 00:00</p>
            <div class="volume-control">
                <span id="volume-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05">
            </div>
        </div>

        <audio id="bg-music" loop>
            <source src="../music-player/songs/enhypen-no-doubt.mp3" type="audio/mp3">
        </audio>
        
        <script src="../music-player/music-player.js"></script> 
        <script src="../heart-rose-star/heart-rose-star.js"></script>
        <script>
            function getDateDifference(date1, date2) {
                let years = date2.getFullYear() - date1.getFullYear();
                let months = date2.getMonth() - date1.getMonth();
                let days = date2.getDate() - date1.getDate();

                if (days < 0) {
                    months--;
                    let previousMonth = new Date(date2.getFullYear(), date2.getMonth(), 0);
                    days += previousMonth.getDate();
                }

                if (months < 0) {
                    years--;
                    months += 12;
                }

                return { years, months, days };
            }

            const page4Text = document.querySelector(".page4-text")
            
            const now = new Date()
            const bestDay = new Date("2024-06-09") 
            const interval = getDateDifference(bestDay, now);

            let html = ""
            if (interval.years > 0 ) {
                html += `${interval.years} yıl`

                if (interval.months == 0 && interval.days == 0) {
                    html += "dan "
                }
                else if (interval.years) {
                    html += ", "
                }
            }

            if (interval.months > 0) {
                html += `${interval.months} ay`

                if (interval.days == 0) {
                    html += "dan "
                }
                else {
                    html += `, `
                }
            }

            if (interval.days > 0) {
                html += `${interval.days} günden ` 
            }

            page4Text.innerHTML = html + "beri hayatımın her anını daha da güzel ve anlamlı kıldığın ve kılmaya devam ettiğin, hayatı sevmem için bir sebep verdiğin, bunca zaman bana yol arkadaşı olduğun, o şapşal yanaklı tipin ve o güzel kalbinle beni böyle biri yaptığın için," 
        </script>
    </body>
</html>
