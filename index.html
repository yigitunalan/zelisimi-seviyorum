<!DOCTYPE html>
<html>

    <body>

        <div class="roses-container"></div>

        <h2>
            Kendisi için her şeyi yapabileceğim, hayallerimi süsleyen , onsuz bir şey hayal edemediğim, herşey ve herkesten çok sevip değer verdiğim (bazen de üzdüğüm), hayatıma bıraktığı etkinin farkında olmayan, her yerinden şapşallık ve tatlılık akan biricik Zelişim,

        </div>

        <audio id="bg-music" loop>
            <source src="music-player/songs/twice-what-is-love.mp3" type="audio/mp3">
