<!DOCTYPE html>
<html>
<head>
    <title>SENİ ÇOK SEVİYORUM</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="music-player/music-player.css">
    <link rel="stylesheet" href="heart-rose-star/heart-rose-star.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hearts-container"></div>
    <div class="roses-container"></div>
    <div class="stars-container"></div>

    <div class="images">
        <img src="gifs/bap-cat.gif" alt="Bap Cat">
        <img src="gifs/happy-cat.gif" alt="Happy Cat">
    </div>

    <h1>UMARIM YOLLARIMIZ ASLA AYRILMAZ</h1>
    <h1>BENİM KUTUM VE ŞAPŞAL KEDİM OLMAYA DEVAM EDİCEK MİSİİİİNNNN??</h1>

    <div id="music-player">
        <button id="play-pause-btn">❚❚</button>
        <p id="music-info">00:00 / 00:00</p>
        <div class="volume-control">
            <span id="volume-icon">🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05">
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="music-player/songs/enhypen-moonstruck.mp3" type="audio/mp3">
    </audio>

    <div class="buttons">
        <a href="ily.html">
            <button>EVEEEEEEEETTTTTTTT</button>
        </a>
        <button id="noButton">hyr :(</button>
    </div>

    <script src="music-player/music-player.js"></script> 
    <script src="heart-rose-star/heart-rose-star.js"></script>
    <script>
        const noButton = document.getElementById('noButton');
        const buffer = 100;
        
        noButton.addEventListener('mouseenter', () => {
            const maxX = window.innerWidth - noButton.clientWidth - buffer;
            const maxY = window.innerHeight - noButton.clientHeight - buffer;
            const minX = buffer;
            const minY = buffer;
            
            let randomX = Math.random() * (maxX - minX) + minX;
            let randomY = Math.random() * (maxY - minY) + minY;
            
            randomX = Math.min(Math.max(randomX, minX), maxX);
            randomY = Math.min(Math.max(randomY, minY), maxY);
            
            noButton.style.transition = 'transform 0.35s ease-in-out';
            noButton.style.transform = `translate(${randomX - window.innerWidth / 2}px, ${randomY - window.innerHeight / 2}px)`;
        });
    </script>
</body>
</html>
